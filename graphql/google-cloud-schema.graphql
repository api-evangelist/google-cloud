"""
Google Cloud Platform - Conceptual GraphQL Schema
Covers major GCP service domains: Compute, Storage, Databases, Kubernetes,
Serverless, Big Data, AI/ML, Security, DevOps, Networking, and Observability.
GCP's native interface is REST (googleapis); this schema models GCP resources
as a GraphQL layer suitable for federation or developer portal use.
Reference: https://cloud.google.com/apis | https://github.com/googleapis
"""

scalar DateTime
scalar JSON
scalar Long

# ---------------------------------------------------------------------------
# Shared / Enumerations
# ---------------------------------------------------------------------------

enum ResourceStatus {
  RUNNING
  STOPPED
  PENDING
  TERMINATED
  DELETING
  PROVISIONING
  STAGING
  REPAIRING
  UNKNOWN
}

enum Region {
  US_CENTRAL1
  US_EAST1
  US_EAST4
  US_WEST1
  US_WEST2
  US_WEST3
  US_WEST4
  EUROPE_WEST1
  EUROPE_WEST2
  EUROPE_WEST3
  EUROPE_WEST4
  EUROPE_NORTH1
  ASIA_EAST1
  ASIA_EAST2
  ASIA_NORTHEAST1
  ASIA_SOUTHEAST1
  SOUTHAMERICA_EAST1
  AUSTRALIA_SOUTHEAST1
}

# ---------------------------------------------------------------------------
# COMPUTE ENGINE
# ---------------------------------------------------------------------------

"""A virtual machine instance running on Google Compute Engine."""
type Instance {
  id: ID!
  name: String!
  description: String
  status: ResourceStatus!
  zone: String!
  region: Region!
  machineType: MachineType
  network: Network
  subnet: Subnet
  disks: [Disk!]
  tags: [String!]
  labels: JSON
  externalIp: String
  internalIp: String
  serviceAccount: ServiceAccount
  creationTimestamp: DateTime!
  lastStartTimestamp: DateTime
  cpuPlatform: String
  canIpForward: Boolean
  deletionProtection: Boolean
  selfLink: String
}

"""Hardware configuration profile available on Compute Engine."""
type MachineType {
  id: ID!
  name: String!
  description: String
  guestCpus: Int!
  memoryMb: Int!
  zone: String
  isSharedCpu: Boolean
  accelerators: [AcceleratorConfig!]
  selfLink: String
}

"""GPU/TPU accelerator configuration attached to a machine type."""
type AcceleratorConfig {
  acceleratorType: String!
  acceleratorCount: Int!
}

"""Virtual Private Cloud network resource."""
type Network {
  id: ID!
  name: String!
  description: String
  autoCreateSubnetworks: Boolean
  subnetworks: [Subnet!]
  peerings: [NetworkPeering!]
  routingConfig: String
  mtu: Int
  creationTimestamp: DateTime!
  selfLink: String
}

"""Subnet within a VPC network."""
type Subnet {
  id: ID!
  name: String!
  description: String
  network: Network
  region: Region!
  ipCidrRange: String!
  gatewayAddress: String
  privateIpGoogleAccess: Boolean
  secondaryIpRanges: [SecondaryIpRange!]
  creationTimestamp: DateTime!
  selfLink: String
}

"""Secondary IP range on a subnet."""
type SecondaryIpRange {
  rangeName: String!
  ipCidrRange: String!
}

"""VPC network peering connection."""
type NetworkPeering {
  name: String!
  network: String!
  state: String
  stateDetails: String
  exchangeSubnetRoutes: Boolean
}

"""Firewall rule controlling ingress or egress traffic on a network."""
type Firewall {
  id: ID!
  name: String!
  description: String
  network: Network
  priority: Int
  direction: String
  allowed: [FirewallRule!]
  denied: [FirewallRule!]
  sourceRanges: [String!]
  destinationRanges: [String!]
  sourceTags: [String!]
  targetTags: [String!]
