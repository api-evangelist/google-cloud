}

"""VLAN attachment on a Dedicated or Partner Interconnect."""
type InterconnectAttachment {
  id: ID!
  name: String!
  description: String
  region: Region!
  router: CloudRouter
  interconnect: Interconnect
  bandwidth: String
  vlanTag8021q: Int
  cloudRouterIpAddress: String
  customerRouterIpAddress: String
  state: String!
  selfLink: String
}

"""Cloud Router for dynamic BGP routing within a VPC."""
type CloudRouter {
  id: ID!
  name: String!
  description: String
  region: Region!
  network: Network
  bgp: JSON
  bgpPeers: [BGPPeer!]
  interfaces: [RouterInterface!]
  selfLink: String
}

"""BGP peer configuration on a Cloud Router."""
type BGPPeer {
  name: String!
  interfaceName: String
  ipAddress: String
  peerIpAddress: String
  peerAsn: Int
  advertisedRoutePriority: Int
}

"""Network interface on a Cloud Router."""
type RouterInterface {
  name: String!
  linkedVpnTunnel: String
  linkedInterconnectAttachment: String
  ipRange: String
}

# ---------------------------------------------------------------------------
# OBSERVABILITY — CLOUD MONITORING
# ---------------------------------------------------------------------------

"""Monitoring metric descriptor defining a measurement type."""
type MetricDescriptor {
  id: ID!
  name: String!
  type: String!
  labels: [LabelDescriptor!]
  metricKind: String!
  valueType: String!
  unit: String
  description: String
  displayName: String
  monitoredResourceTypes: [String!]
}

"""Label descriptor for a metric or monitored resource."""
type LabelDescriptor {
  key: String!
  valueType: String!
  description: String
}

"""Point-in-time or range measurement for a metric."""
type TimeSeries {
  metric: String!
  resource: String!
  metricKind: String!
  valueType: String!
  points: [DataPoint!]!
}

"""Individual data point within a time series."""
type DataPoint {
  interval: TimeInterval!
  value: Float!
}

"""Time interval for a monitoring data point."""
type TimeInterval {
  startTime: DateTime
  endTime: DateTime!
}

"""Cloud Monitoring alerting policy triggering notifications on conditions."""
type AlertPolicy {
  id: ID!
  name: String!
  displayName: String!
  documentation: JSON
  conditions: [AlertCondition!]!
  combiner: String!
  enabled: Boolean
  notificationChannels: [NotificationChannel!]
  labels: JSON
  validity: JSON
  creationRecord: JSON
  mutationRecord: JSON
}

"""Individual condition in an alerting policy."""
type AlertCondition {
  name: String!
  displayName: String
  conditionThreshold: JSON
  conditionAbsent: JSON
}

"""Channel through which monitoring alerts are delivered."""
type NotificationChannel {
  id: ID!
  name: String!
  displayName: String
  description: String
  type: String!
  labels: JSON
  userLabels: JSON
  enabled: Boolean
  verificationStatus: String
  creationRecord: JSON
  mutationRecord: JSON
}

"""Cloud Monitoring custom dashboard."""
type Dashboard {
  id: ID!
  name: String!
  displayName: String!
  etag: String
  mosaicLayout: JSON
  gridLayout: JSON
  columnLayout: JSON
}

# ---------------------------------------------------------------------------
# OBSERVABILITY — CLOUD LOGGING
# ---------------------------------------------------------------------------

"""Individual log entry written to Cloud Logging."""
type LogEntry {
  id: ID!
  logName: String!
  resource: JSON!
  timestamp: DateTime
  receiveTimestamp: DateTime
  severity: String
  insertId: String
  httpRequest: JSON
  labels: JSON
  operation: JSON
  trace: String
  spanId: String
  textPayload: String
  jsonPayload: JSON
  protoPayload: JSON
}

"""Cloud Logging log bucket retaining log entries."""
type LogBucket {
  id: ID!
  name: String!
  description: String
  retentionDays: Int!
  locked: Boolean
  lifecycleState: String
  restrictedFields: [String!]
  createTime: DateTime!
  updateTime: DateTime!
}

"""Cloud Logging sink exporting log entries to a destination."""
type LogSink {
  id: ID!
  name: String!
  destination: String!
  filter: String
  description: String
  disabled: Boolean
  writerIdentity: String
  includeChildren: Boolean
  createTime: DateTime!
  updateTime: DateTime!
}

# ---------------------------------------------------------------------------
# OBSERVABILITY — CLOUD TRACE
# ---------------------------------------------------------------------------

"""Cloud Trace distributed trace grouping spans for a single request."""
type Trace {
  projectId: String!
  traceId: String!
  spans: [Span!]!
}

"""Individual span within a Cloud Trace distributed trace."""
type Span {
  spanId: String!
  name: String!
  startTime: DateTime!
  endTime: DateTime!
  parentSpanId: String
  labels: JSON
  status: JSON
  stackTrace: JSON
  childSpanCount: Int
}

