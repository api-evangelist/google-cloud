  selfLink: String
}

"""Individual allow/deny rule within a Firewall resource."""
type FirewallRule {
  ipProtocol: String!
  ports: [String!]
}

"""Cloud Load Balancer forwarding rule."""
type LoadBalancer {
  id: ID!
  name: String!
  description: String
  region: Region
  ipAddress: String
  ipProtocol: String
  portRange: String
  target: String
  loadBalancingScheme: String
  backendService: BackendService
  creationTimestamp: DateTime!
  selfLink: String
}

"""Backend service defining how traffic is distributed across backends."""
type BackendService {
  id: ID!
  name: String!
